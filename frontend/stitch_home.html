<!-- Header Section -->
<div class="px-margin-mobile py-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface" id="greeting">Namaste 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2" data-i18n="todayQuestion">Aaj aapke khet mein kya ho raha hai?</p>
<div class="mt-4 inline-flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">landscape</span>
<span class="font-label-bold text-label-bold text-on-surface" id="fieldsSummary">Loading...</span>
</div>
</div>
<!-- Primary Action -->
<div class="px-margin-mobile flex flex-col gap-stack-sm mb-stack-md">
<a href="my_fields.html" class="w-full min-h-[64px] bg-primary text-on-primary rounded-2xl flex items-center justify-center gap-3 shadow-md active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">grass</span>
<span class="font-headline-md text-headline-md" data-i18n="mereKhet">Mere khet</span>
</a>
</div>
<!-- Recent Diary Activity -->
<div class="px-margin-mobile pb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm" data-i18n="recentActivity">Haal ki Diary Updates</h2>
<div id="recentActivityContainer" class="flex flex-col gap-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant" data-i18n="loading">Loading...</p>
</div>
</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]"><div class="flex items-center justify-center gap-stack-lg h-20 px-4"><a aria-current="page" class="flex flex-col items-center justify-center w-16 text-primary" href="stitch_home.html"><span class="material-symbols-outlined">home</span><span class="text-[10px] font-label-bold uppercase mt-1" data-i18n="home">Home</span></a><a class="flex flex-col items-center justify-center w-16 text-on-surface-variant" href="my_fields.html"><span class="material-symbols-outlined">potted_plant</span><span class="text-[10px] font-label-bold uppercase mt-1" data-i18n="fields">Fields</span></a></div></nav>

<script>
const API_BASE = "https://terralens-vvqc.onrender.com";

function toggleLangMenu() {
  document.getElementById("langMenu").classList.toggle("hidden");
}

document.addEventListener("click", (e) => {
  const menu = document.getElementById("langMenu");
  const btn = document.getElementById("langBtn");
  if (menu && !menu.classList.contains("hidden") && !menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.add("hidden");
  }
});

function switchLang(lang) {
  setSavedLanguage(lang);
  applyTranslations();
  updateLangBtnLabel();
  renderGreeting();
  loadRecentActivity();
  document.getElementById("langMenu").classList.add("hidden");
}

function updateLangBtnLabel() {
  const labels = { hinglish: "Hinglish", hindi: "हिंदी", english: "English" };
  document.getElementById("langBtnLabel").textContent = labels[getSavedLanguage()] || "Hinglish";
}

function renderGreeting() {
  const name = getSavedName();
  const el = document.getElementById("greeting");
  el.textContent = name
    ? `${t("namasteGreeting")} ${name}${t("nameSuffix")} 👋`
    : `${t("namasteGreeting")} 👋`;
}

async function loadUserName() {
  // Try backend first (source of truth once /user endpoint exists), fall back to localStorage
  try {
    const res = await fetch(`${API_BASE}/user`);
    if (res.ok) {
      const user = await res.json();
      if (user && user.name) {
        setSavedName(user.name);
      }
    }
  } catch (err) {
    // backend not ready yet — localStorage value (saved during language select) is used instead
  }
  renderGreeting();
}

async function loadRecentActivity() {
  const container = document.getElementById("recentActivityContainer");
  try {
    const res = await fetch(`${API_BASE}/updates/recent?limit=3`);
    if (!res.ok) throw new Error("Failed");
    const updates = await res.json();

    if (!updates || updates.length === 0) {
      container.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant">${t("noRecentActivity")}</p>`;
      return;
    }

    container.innerHTML = updates.map(u => {
      const dateStr = new Date(u.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
      const weatherTag = u.weather_temp != null ? ` • 🌦 ${Math.round(u.weather_temp)}°C` : "";
      return `
        <a href="field_detail.html?id=${u.field_id}" class="flex items-center gap-3 bg-surface-container-high rounded-xl p-3 shadow-sm active:scale-[0.98] transition-transform">
          <img src="${u.photo_url}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0"/>
          <div class="flex-1 min-w-0">
            <p class="font-label-bold text-label-bold text-on-surface truncate">${u.field_name || ""}</p>
            <p class="text-xs text-on-surface-variant">📅 ${dateStr}${weatherTag}</p>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant text-[20px]">chevron_right</span>
        </a>
      `;
    }).join("");
  } catch (err) {
    container.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant">${t("noRecentActivity")}</p>`;
    console.error(err);
  }
}

async function loadFieldsSummary() {
  const el = document.getElementById("fieldsSummary");
  try {
    const res = await fetch(`${API_BASE}/fields`);
    const fields = await res.json();
    const totalAcres = fields.reduce((sum, f) => sum + (f.area || 0), 0);
    el.textContent = `${fields.length} ${t("fields")} • ${totalAcres.toFixed(1)} Acres`;
  } catch (err) {
    el.textContent = "Data load nahi ho paya";
    console.error(err);
  }
}

applyTranslations();
updateLangBtnLabel();
loadUserName();
loadFieldsSummary();
loadRecentActivity();
</script>
</body></html>
