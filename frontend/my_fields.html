<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2" data-i18n="mereKhet">Mere Khet</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant" data-i18n="harFieldTrack">Har field ko track karein.</p>
</div>

</div>

<div class="flex justify-center max-w-[1280px] mx-auto pointer-events-auto">

<span class="material-symbols-outlined text-[24px]">add</span>
            <span data-i18n="nayaKhetJodein">Naya khet jodein</span>
         </a>
</div>
</div>

<script>
const API_BASE = "https://terralens-vvqc.onrender.com";

function toggleLangMenu() {
  document.getElementById("langMenu").classList.toggle("hidden");
}

document.addEventListener("click", (e) => {
  const menu = document.getElementById("langMenu");
  const btn = document.getElementById("langBtn");
  if (menu && !menu.classList.contains("hidden") && !menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.add("hidden");
  }
});

function switchLang(lang) {
  setSavedLanguage(lang);
  applyTranslations();
  updateLangBtnLabel();
  document.getElementById("langMenu").classList.add("hidden");
}

function updateLangBtnLabel() {
  const labels = { hinglish: "Hinglish", hindi: "हिंदी", english: "English" };
  document.getElementById("langBtnLabel").textContent = labels[getSavedLanguage()] || "Hinglish";
}

async function loadFields() {
  const container = document.getElementById("fieldsContainer");
  try {
    const res = await fetch(`${API_BASE}/fields`);
    const fields = await res.json();

    if (fields.length === 0) {
      container.innerHTML = `<p class="text-on-surface-variant">${t("khetNahiMila")}</p>`;
      return;
    }

    container.innerHTML = fields.map(field => {
      const health = field.crop_health || "Unknown";
      const risk = field.risk_level || "Unknown";
      const isHighlighted = risk === "Medium" || risk === "High";

      const cardClasses = isHighlighted
        ? "block bg-surface-container rounded-xl p-6 shadow-md flex flex-col gap-4 relative overflow-hidden transform transition active:scale-[0.98]"
        : "block bg-surface-container-low rounded-xl p-6 shadow-sm flex flex-col gap-4 relative overflow-hidden transform transition active:scale-[0.98]";

      return `
        <a class="${cardClasses}" href="field_detail.html?id=${field.id}">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="font-headline-md text-headline-md text-on-surface">${field.name}</h2>
              <p class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider mt-1">${field.crop}</p>
            </div>
            <div class="flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-full">
              <span class="material-symbols-outlined text-on-surface-variant text-[18px]">aspect_ratio</span>
              <span class="font-label-bold text-label-bold text-on-surface">${field.area} ac</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-2">
            <div class="bg-surface rounded-lg p-3">
              <p class="font-label-bold text-label-bold text-on-surface-variant mb-1">Health</p>
              <div class="flex items-center gap-2">
                <span class="font-body-md text-body-md text-on-surface">${health}</span>
              </div>
            </div>
            <div class="bg-surface rounded-lg p-3">
              <p class="font-label-bold text-label-bold text-on-surface-variant mb-1">Risk</p>
              <div class="flex items-center gap-2">
                <span class="font-body-md text-body-md text-on-surface">${risk}</span>
              </div>
            </div>
          </div>
        </a>
      `;
    }).join("");
  } catch (err) {
    container.innerHTML = `<p class="text-error">Filhaal data load nahi ho paya. Thodi der baad dobara try karein.</p>`;
    console.error(err);
  }
}

applyTranslations();
updateLangBtnLabel();
loadFields();
</script>
</body></html>
