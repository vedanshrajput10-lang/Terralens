<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { theme: { extend: { "colors": { "primary": "#012d1d", "on-primary": "#ffffff", "surface": "#fcf9f8", "on-surface": "#1b1c1c", "on-surface-variant": "#414844", "surface-container": "#f0eded", "surface-container-low": "#f6f3f2", "error-container": "#ffdad6", "on-error-container": "#93000a" } } } };</script><style>body { min-height: max(884px, 100dvh); }</style>
</head><body class="bg-surface font-sans text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-sm"><div class="h-16 px-5 flex items-center gap-3"><button onclick="history.back()" class="w-12 h-12 flex items-center justify-center text-on-surface-variant"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="text-xl font-bold text-primary truncate">Field Detail</h1></div></header>

<main class="pt-16" id="mainContent">
  <p class="p-5 text-on-surface-variant">Loading...</p>
</main>

<script>
const API_BASE = "http://127.0.0.1:8000";

function getFieldIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

async function loadFieldDetail() {
  const id = getFieldIdFromUrl();
  const mainContent = document.getElementById("mainContent");

  if (!id) {
    mainContent.innerHTML = `<p class="p-5 text-error">Field ID nahi mila.</p>`;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/fields/${id}`);
    if (!res.ok) throw new Error("Not found");
    const field = await res.json();

    const health = field.crop_health || "Unknown";
    const risk = field.risk_level || "Unknown";
    const village = field.location?.village || "";
    const district = field.location?.district || "";
    const location = [village, district].filter(Boolean).join(", ") || "Location not set";

    const photoHtml = field.photo_url
      ? `<img src="${field.photo_url}" class="w-full h-56 object-cover"/>`
      : `<div class="w-full h-40 bg-surface-container flex items-center justify-center text-on-surface-variant">Koi photo nahi</div>`;

    mainContent.innerHTML = `
      ${photoHtml}
      <div class="px-5 py-4 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="bg-surface-container px-3 py-1 rounded-full text-sm font-semibold">${field.area} Acres</span>
          <span class="bg-surface-container px-3 py-1 rounded-full text-sm font-semibold">${field.season}</span>
        </div>
        <h2 class="text-3xl font-bold text-on-surface">${field.name}</h2>
        <p class="text-on-surface-variant">${field.crop} • ${location}</p>
      </div>

      <div class="px-5 py-4">
        <h3 class="text-lg font-bold mb-3">Farm Health</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-surface-container-low rounded-xl p-4">
            <p class="text-sm text-on-surface-variant mb-1">Health</p>
            <p class="font-semibold">${health}</p>
          </div>
          <div class="bg-surface-container-low rounded-xl p-4">
            <p class="text-sm text-on-surface-variant mb-1">Risk</p>
            <p class="font-semibold">${risk}</p>
          </div>
        </div>
      </div>

      <div class="px-5 py-4">
        <h3 class="text-lg font-bold mb-3">Field Info</h3>
        <div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-2">
          <div class="flex justify-between"><span class="text-on-surface-variant">Soil Type</span><span>${field.soil_type || "Not set"}</span></div>
          <div class="flex justify-between"><span class="text-on-surface-variant">Irrigation</span><span>${field.irrigation_method || "Not set"}</span></div>
          <div class="flex justify-between"><span class="text-on-surface-variant">Sowing Date</span><span>${field.sowing_date ? new Date(field.sowing_date).toLocaleDateString() : "Not set"}</span></div>
        </div>
      </div>
    `;
  } catch (err) {
    mainContent.innerHTML = `<p class="p-5 text-error">Field load nahi ho paya.</p>`;
    console.error(err);
  }
}

loadFieldDetail();
</script>
</body></html>
