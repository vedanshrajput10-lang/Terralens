<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { theme: { extend: { "colors": { "primary": "#012d1d", "on-primary": "#ffffff", "surface": "#fcf9f8", "on-surface": "#1b1c1c", "on-surface-variant": "#414844", "surface-container": "#f0eded", "surface-container-low": "#f6f3f2", "error-container": "#ffdad6", "on-error-container": "#93000a", "outline-variant": "#c1c8c2" } } } };</script><style>body { min-height: max(884px, 100dvh); }</style>
<script src="translations.js"></script></head><body class="bg-surface font-sans text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-sm"><div class="h-16 px-5 flex items-center gap-3"><button onclick="history.back()" class="w-12 h-12 flex items-center justify-center text-on-surface-variant"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="text-xl font-bold text-primary truncate" data-i18n="fieldDetail">Field Detail</h1></div></header>

<main class="pt-16 pb-24" id="mainContent">
  <p class="p-5 text-on-surface-variant" data-i18n="loading">Loading...</p>
</main>

<!-- Add Update Modal -->
<div id="updateModal" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-black/40" onclick="closeUpdateModal()"></div>
  <div class="absolute bottom-0 left-0 w-full bg-surface rounded-t-2xl p-5 flex flex-col gap-4 max-h-[85vh] overflow-y-auto">
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-bold" data-i18n="nayaUpdateHeading">Naya Update Jodein</h3>
      <button onclick="closeUpdateModal()" class="w-10 h-10 flex items-center justify-center text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
    </div>

    <div>
      <label class="block text-sm font-semibold text-on-surface-variant mb-1" data-i18n="photoLabel">Photo *</label>
      <input type="file" id="updatePhoto" accept="image/*" capture="environment" class="w-full h-14 px-4 rounded-xl bg-surface-container-low border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary"/>
      <img id="updatePhotoPreview" class="mt-2 w-full h-40 object-cover rounded-xl hidden"/>
    </div>

    <div>
      <label class="block text-sm font-semibold text-on-surface-variant mb-1" data-i18n="noteLabel">Note (optional)</label>
      <textarea id="updateNote" rows="2" data-i18n-placeholder="notePlaceholder" placeholder="jaise: paani diya, patte peele lag rahe hain..." class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
    </div>

    <p id="updateErrorMsg" class="text-error text-sm hidden"></p>

    <button id="updateSubmitBtn" onclick="submitUpdate()" class="w-full h-14 bg-primary text-on-primary rounded-full font-semibold shadow-md active:scale-95 transition-transform">
      <span data-i18n="updateJodeinBtn">Update Jodein</span>
    </button>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

function getFieldIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

const currentFieldId = getFieldIdFromUrl();

async function loadFieldDetail() {
  const id = currentFieldId;
  const mainContent = document.getElementById("mainContent");

  if (!id) {
    mainContent.innerHTML = `<p class="p-5 text-error">Field ID nahi mila.</p>`;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/fields/${id}`);
    if (!res.ok) throw new Error("Not found");
    const field = await res.json();

    const village = field.location?.village || "";
    const district = field.location?.district || "";
    const location = [village, district].filter(Boolean).join(", ") || "";

    const photoHtml = field.photo_url
      ? `<img src="${field.photo_url}" class="w-full h-56 object-cover"/>`
      : `<div class="w-full h-40 bg-surface-container flex items-center justify-center text-on-surface-variant">${t("koiPhotoNahi")}</div>`;

    mainContent.innerHTML = `
      ${photoHtml}
      <div class="px-5 py-4 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="bg-surface-container px-3 py-1 rounded-full text-sm font-semibold">${field.area} Acres</span>
          <span class="bg-surface-container px-3 py-1 rounded-full text-sm font-semibold">${field.season}</span>
        </div>
        <h2 class="text-3xl font-bold text-on-surface">${field.name}</h2>
        <p class="text-on-surface-variant">${field.crop}${location ? " • " + location : ""}</p>
      </div>

      <div class="px-5 py-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-bold" data-i18n="khetKiDiary">Khet ki Diary</h3>
          <button onclick="openUpdateModal()" class="flex items-center gap-1 bg-primary text-on-primary px-4 py-2 rounded-full text-sm font-semibold shadow-sm active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-[18px]">add</span> <span data-i18n="nayaUpdateBtn">Naya Update</span>
          </button>
        </div>
        <div id="diaryTimeline" class="flex flex-col gap-3">
          <p class="text-on-surface-variant text-sm" data-i18n="loading">Loading diary...</p>
        </div>
      </div>
    `;

    applyTranslations();
    loadDiaryTimeline();
  } catch (err) {
    mainContent.innerHTML = `<p class="p-5 text-error">Field load nahi ho paya.</p>`;
    console.error(err);
  }
}

async function loadDiaryTimeline() {
  const container = document.getElementById("diaryTimeline");
  try {
    const res = await fetch(`${API_BASE}/fields/${currentFieldId}/updates`);
    if (!res.ok) throw new Error("Failed");
    const updates = await res.json();

    if (!updates || updates.length === 0) {
      container.innerHTML = `<p class="text-on-surface-variant text-sm">${t("diaryEmpty")}</p>`;
      return;
    }

    // newest first
    updates.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    container.innerHTML = updates.map(u => {
      const dateStr = new Date(u.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
      const weatherTag = u.weather_temp != null
        ? `<span class="text-xs font-semibold text-on-surface-variant">🌦 ${Math.round(u.weather_temp)}°C${u.weather_desc ? ", " + u.weather_desc : ""}</span>`
        : "";
      return `
        <div class="bg-surface-container-low rounded-xl overflow-hidden shadow-sm">
          <img src="${u.photo_url}" class="w-full h-48 object-cover"/>
          <div class="p-3 flex flex-col gap-1">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-on-surface-variant">📅 ${dateStr}</span>
              ${weatherTag}
            </div>
            ${u.note ? `<p class="text-sm text-on-surface">${u.note}</p>` : ""}
          </div>
        </div>
      `;
    }).join("");
  } catch (err) {
    container.innerHTML = `<p class="text-error text-sm">${t("diaryLoadFail")}</p>`;
    console.error(err);
  }
}

function openUpdateModal() {
  document.getElementById("updateModal").classList.remove("hidden");
}

function closeUpdateModal() {
  document.getElementById("updateModal").classList.add("hidden");
  document.getElementById("updatePhoto").value = "";
  document.getElementById("updateNote").value = "";
  document.getElementById("updatePhotoPreview").classList.add("hidden");
  document.getElementById("updateErrorMsg").classList.add("hidden");
}

document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "updatePhoto") {
    const file = e.target.files[0];
    const preview = document.getElementById("updatePhotoPreview");
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.classList.remove("hidden");
    }
  }
});

async function submitUpdate() {
  const errorMsg = document.getElementById("updateErrorMsg");
  const submitBtn = document.getElementById("updateSubmitBtn");
  const photoFile = document.getElementById("updatePhoto").files[0];
  const note = document.getElementById("updateNote").value;

  errorMsg.classList.add("hidden");

  if (!photoFile) {
    errorMsg.textContent = t("photoZaroori");
    errorMsg.classList.remove("hidden");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = `<span>${t("jodRahaHai")}</span>`;

  try {
    const formData = new FormData();
    formData.append("file", photoFile);
    if (note) formData.append("note", note);

    const res = await fetch(`${API_BASE}/fields/${currentFieldId}/updates`, {
      method: "POST",
      body: formData
    });

    if (!res.ok) throw new Error("Server error");

    closeUpdateModal();
    loadDiaryTimeline();
  } catch (err) {
    errorMsg.textContent = t("updateNahiPaya");
    errorMsg.classList.remove("hidden");
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = `<span data-i18n="updateJodeinBtn">${t("updateJodeinBtn")}</span>`;
  }
}

applyTranslations();
loadFieldDetail();
</script>
</body></html>
